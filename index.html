<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SingPost unified portal - illustrative mock-up</title>
<style>
:root{--red:#D7282F;--red-d:#b01f25;--ink:#222;--grey:#404040;--mut:#6b6b6b;--line:#e2e2e2;--bg:#fff;--soft:#f5f5f5;--card:#fff;--ok:#1f7a3d;--okbg:#e6f4ea;--warn:#9a5b00;--warnbg:#fff3df;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
a{color:inherit}
h1,h2,h3{line-height:1.2;margin:0 0 .5em}
h1{font-size:2rem}h2{font-size:1.4rem}h3{font-size:1.05rem}
p{margin:0 0 1em}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.row{display:flex;align-items:center;gap:16px}
.mut{color:var(--mut)}.small{font-size:.875rem}
.lnk{color:var(--red);font-size:.9rem}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
/* demo bar */
#demo{background:#1d1d1d;color:#eee;font-size:13px;position:sticky;top:0;z-index:70}
#demo .row{padding:6px 20px;justify-content:space-between;flex-wrap:wrap;gap:8px}
#demo button,#demo label{background:#333;color:#eee;border:1px solid #555;border-radius:6px;padding:3px 10px;font-size:13px}
#demo .jm{position:relative}
#jlist{display:none;position:absolute;right:0;top:30px;background:#262626;border:1px solid #555;border-radius:8px;min-width:300px;padding:6px;z-index:80}
#jlist.open{display:block}
#jlist button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:6px}
#jlist button:hover{background:#3a3a3a}
/* header */
.strip{background:var(--soft);border-bottom:1px solid var(--line);font-size:14px}
.strip .row{justify-content:space-between;height:38px}
.persona a{text-decoration:none;padding:9px 14px;display:inline-block;color:var(--mut)}
.persona a.on{color:var(--red);font-weight:600;box-shadow:inset 0 -3px var(--red)}
.tools{display:flex;gap:18px;align-items:center}
.tools a{text-decoration:none}
.main{background:var(--bg);border-bottom:1px solid var(--line)}
.main .row{height:72px}
.logo{font-size:1.7rem;font-weight:700;color:var(--red);text-decoration:none;letter-spacing:-.5px;margin-right:12px}
.logo b{color:var(--grey)}
.menu{display:flex;gap:2px;flex:1;overflow:visible}
.mi{position:relative}
.mi>a{display:block;padding:24px 12px;text-decoration:none;font-weight:600;white-space:nowrap;font-size:.95rem}
.mi:hover>a,.mi:focus-within>a{color:var(--red)}
.sub{display:none;position:absolute;left:0;top:70px;background:var(--card);border:1px solid var(--line);border-radius:10px;min-width:240px;padding:8px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.14)}
.mi:hover .sub,.mi:focus-within .sub{display:block}
.sub a{display:block;padding:8px 12px;border-radius:6px;text-decoration:none;font-size:.95rem}
.sub a:hover{background:var(--soft);color:var(--red)}
.acct{display:flex;gap:10px;align-items:center}
.dd{position:relative}
.ddm{display:none;position:absolute;right:0;top:100%;margin-top:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;min-width:280px;padding:8px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.16)}
.ddm.open{display:block}
.ddm a,.ddm button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;border:0;background:none;text-align:left;text-decoration:none;color:var(--ink);font-size:.95rem}
.ddm a:hover,.ddm button:hover{background:var(--soft)}
.ddm hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.ddm .hd{font-size:.8rem;color:var(--mut);padding:6px 12px}
.av{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 12px 5px 6px;border-radius:999px}
.av i{font-style:normal;background:var(--red);color:#fff;width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:.8rem;font-weight:700}
/* buttons */
.btn{background:var(--red);color:#fff;border:1px solid var(--red);border-radius:8px;padding:10px 20px;font-weight:600;text-decoration:none;display:inline-block}
.btn:hover{background:var(--red-d)}
.btn.ghost{background:transparent;color:var(--red)}
.btn.ghost:hover{background:var(--soft)}
.btn.lg{padding:13px 28px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--soft);color:var(--grey)}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.red{background:var(--red);color:#fff}
.nw{display:none;background:#ffcf33;color:#222;font-size:.68rem;font-weight:700;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:middle}
body.hl .nw{display:inline-block}
body.hl .newbox{outline:2px dashed #e6a800;outline-offset:3px}
/* service bar */
#svc{background:var(--card);border-bottom:1px solid var(--line)}
.svcbar{display:flex;gap:6px;align-items:center;padding:8px 20px;overflow-x:auto;font-size:.9rem}
.svcbar .lb{color:var(--mut);white-space:nowrap;margin-right:6px}
.svcbar button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:999px;white-space:nowrap}
.svcbar button.on{background:var(--red);border-color:var(--red);color:#fff}
.svcbar button small{opacity:.75;margin-left:6px}
/* hero */
.hero{background:linear-gradient(120deg,#BD2426 0%,#8c1214 100%);color:#fff;position:relative;overflow:hidden}
.hero .wrap{position:relative;z-index:1;padding-top:56px;padding-bottom:56px}
.hero h1{font-size:2.6rem;max-width:620px;margin-bottom:.6em}
.hero p{max-width:560px;opacity:.95}
.trackcard{background:var(--card);color:var(--ink);border-radius:14px;padding:20px;max-width:640px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.trackcard label{font-weight:600;display:block;margin-bottom:8px}
.trow{display:flex;gap:10px}
.trow input{flex:1}
.quick{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:.92rem}
.quick a{color:var(--red);font-weight:600;text-decoration:none}
.quick a:hover{text-decoration:underline}
/* sections */
.sec{padding:44px 0}
.sec.alt{background:var(--soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.card h2,.card h3{margin-bottom:.4em}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.links a{color:var(--red);font-weight:600;text-decoration:none;border:1px solid var(--line);padding:7px 14px;border-radius:999px;font-size:.92rem}
.links a:hover{background:var(--soft)}
.feat{display:grid;grid-template-columns:1fr 1fr;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.feat .img{min-height:220px;background:linear-gradient(135deg,#3b3b3b,#1f1f1f);display:grid;place-items:center;color:#fff;font-weight:700;font-size:1.4rem}
.feat .img.v{background:linear-gradient(135deg,#1c4e6b,#0f2f42)}
.feat .img.m{background:linear-gradient(135deg,#BD2426,#7a1012)}
.feat .tx{padding:28px}
/* pages */
.pg{padding:28px 20px 60px}
.ph{margin-bottom:18px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0 28px}
.act{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:16px;text-align:left}
.act:hover{border-color:var(--red)}
.act b{display:block;margin-bottom:2px}
.act span{font-size:.88rem;color:var(--mut)}
.prow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:10px;flex-wrap:wrap}
.prow b{display:block}
/* forms */
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.f label{font-weight:600;font-size:.9rem}
input,select{font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:100%}
input[type=checkbox],input[type=radio]{width:auto}
.err{background:var(--warnbg);color:var(--warn);padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:.92rem}
.okbox{background:var(--okbg);color:var(--ok);padding:12px 16px;border-radius:10px;margin-bottom:14px;font-weight:600}
.steps{display:flex;gap:8px;margin:0 0 22px}
.steps span{flex:1;padding:8px 4px;border-bottom:4px solid var(--line);font-size:.88rem;color:var(--mut)}
.steps .on{border-color:var(--red);color:var(--ink);font-weight:600}
.steps .dn{border-color:var(--ok);color:var(--ink)}
.auth{display:grid;grid-template-columns:1fr 1fr;gap:32px;padding:44px 20px;align-items:start}
.authcard,.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px}
.authside{padding:12px 8px}
.svcs{list-style:none;padding:0;margin:0 0 18px}
.svcs li{padding:10px 0;border-bottom:1px solid var(--line)}
.svcs li span{display:block;color:var(--mut);font-size:.9rem}
.note{background:var(--soft);padding:14px 16px;border-radius:10px;font-size:.92rem}
.narrow{max-width:760px;margin:0 auto}
.opt{display:flex;gap:14px;align-items:flex-start;border:2px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;background:var(--card);width:100%;text-align:left;color:var(--ink)}
.opt.on{border-color:var(--red)}
.opt .mk{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:#fff;margin-top:2px}
.opt.on .mk{background:var(--red);border-color:var(--red)}
.opt .pr{margin-left:auto;font-weight:700;white-space:nowrap}
.opt span.d{display:block;color:var(--mut);font-size:.9rem;font-weight:400}
.btns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.tl{list-style:none;margin:0;padding:0 0 0 6px}
.tl li{position:relative;padding:0 0 18px 28px;border-left:2px solid var(--line);margin-left:6px}
.tl li::before{content:"";position:absolute;left:-8px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--card);border:2px solid var(--line)}
.tl li.done{border-color:var(--ok)}.tl li.done::before{background:var(--ok);border-color:var(--ok)}
.tl li.now::before{background:var(--red);border-color:var(--red)}
.tl li.now b{color:var(--red)}
.tl li span{display:block;color:var(--mut);font-size:.88rem}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th,.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl th{color:var(--mut);font-weight:600;font-size:.82rem}
.tbl select,.tbl input[type=text]{padding:6px 8px;font-size:.88rem}
.bar{position:sticky;bottom:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px;box-shadow:0 -6px 20px rgba(0,0,0,.08)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px}
.tabs button{border:0;background:none;color:var(--mut);padding:10px 18px;font-weight:600;border-bottom:3px solid transparent}
.tabs button.on{color:var(--red);border-color:var(--red)}
.addr{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--card)}
.addr b{display:block}.addr span{font-size:.85rem;color:var(--mut);display:block;margin-bottom:8px}
.prod{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.prod .ph1{height:110px;background:var(--soft);display:grid;place-items:center;color:var(--mut);font-size:.85rem}
.prod div.b{padding:12px 14px}
.qrbox{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.code{font:700 1.6rem/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.1em}
/* footer */
footer{background:var(--soft);border-top:1px solid var(--line);padding:36px 0;margin-top:20px;font-size:.92rem}
footer .grid4 a{display:block;text-decoration:none;color:var(--mut);padding:3px 0}
footer .legal{margin-top:22px;color:var(--mut);font-size:.82rem}
/* chat */
#fab{position:fixed;right:20px;bottom:20px;z-index:80;background:var(--red);color:#fff;border:0;border-radius:999px;padding:13px 20px;display:flex;gap:8px;align-items:center;font-weight:600;box-shadow:0 8px 22px rgba(0,0,0,.3)}
#chat{position:fixed;right:20px;bottom:20px;z-index:90;width:380px;max-width:calc(100vw - 24px);height:560px;max-height:calc(100vh - 80px);background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden}
#chat[hidden]{display:none}
#chat header{background:var(--red);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
#chat header small{display:block;opacity:.85}
#chat header button{background:none;border:0;color:#fff;font-size:1.2rem}
#cmsgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--soft)}
.m{max-width:86%;padding:10px 13px;border-radius:14px;font-size:.93rem}
.m.b{background:var(--card);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.m.u{background:var(--red);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.m.s{align-self:center;background:none;color:var(--mut);font-size:.8rem;max-width:100%}
.m .cardx{background:var(--soft);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:.88rem}
.m .cardx div{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
#cchips{padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px;border-top:1px solid var(--line);background:var(--card);min-height:8px}
#cchips button{border:1px solid var(--red);color:var(--red);background:var(--card);border-radius:999px;padding:6px 12px;font-size:.85rem}
#chat form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--card)}
#chat form .btn{padding:8px 14px}
.typing{display:inline-flex;gap:4px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--mut);animation:b 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-4px);opacity:.5}}
/* overlay + toast */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none;place-items:center}
#ov.on{display:grid}
#ov .box{background:var(--card);border-radius:16px;padding:30px 34px;max-width:420px;text-align:center}
.spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--red);border-radius:50%;margin:0 auto 14px;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:10px;z-index:120;display:none;max-width:90vw;font-size:.92rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:900px){
 .grid2,.grid3,.grid4,.acts,.feat,.auth{grid-template-columns:1fr 1fr}
 .menu{display:none}.hero h1{font-size:2rem}
}
@media (max-width:620px){
 .grid2,.grid3,.grid4,.acts,.feat,.auth{grid-template-columns:1fr}
 .tools a.hide-s{display:none}
 .trow{flex-direction:column}
 .tbl{display:block;overflow-x:auto}
}

/* ---- site-like shell ---- */
.hd1{background:#fff}
.hd1 .row{height:78px;gap:20px}
.logo img{height:40px;display:block}
.logotxt{font-size:1.7rem;font-weight:700;color:var(--red);letter-spacing:-.5px}
.persona{display:flex;background:var(--soft);border-radius:999px;padding:4px;margin-left:8px}
.persona a{padding:7px 18px;border-radius:999px;font-size:.9rem;text-decoration:none;color:var(--grey);box-shadow:none;font-weight:600}
.persona a.on{background:var(--red);color:#fff;box-shadow:none}
.util{margin-left:auto;display:flex;align-items:center;gap:20px;font-size:.92rem}
.util>a,.util .dd>a{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;color:var(--ink)}
.util img{height:22px;width:auto}
.util a:hover{color:var(--red)}
.menurow{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff}
.menurow .menu{height:54px;align-items:center}
.mi>a{padding:15px 18px;font-size:.98rem}
.sub{top:52px}
.ddm .ti{display:flex;justify-content:flex-start;gap:12px}
.ddm .ti img{height:26px;width:26px;object-fit:contain}
#srch{position:fixed;inset:0;background:rgba(255,255,255,.98);z-index:110;display:none;padding:60px 20px}
#srch.on{display:block}
#srch .in{max-width:760px;margin:0 auto}
#srch h3{margin:26px 0 10px;color:var(--mut);font-size:.9rem;font-weight:600}
#srch .x{position:absolute;right:24px;top:20px;border:0;background:none;font-size:1.6rem}
.hero.photo{background:linear-gradient(120deg,#D7282F,#8c1214);min-height:430px;display:flex;align-items:center}
.hero.photo>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero.photo::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.4),rgba(0,0,0,0) 70%);z-index:1}
.hero.photo .wrap{z-index:2;width:100%}
.hero.photo h1{text-shadow:0 2px 12px rgba(0,0,0,.35)}
.qrow{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:-34px;position:relative;z-index:3}
.qtile{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 20px;text-decoration:none;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.qtile:hover{color:var(--red)}
.qtile img{height:40px;width:40px;object-fit:contain}
.svc2 .card{display:flex;flex-direction:column;gap:6px}
.svc2 .card>img{height:64px;width:64px;object-fit:contain;margin-bottom:6px}
.band{background:var(--soft);border-radius:14px;padding:26px 28px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.band h2{margin:0}
.fx{display:grid;grid-template-columns:1fr 1fr;border-radius:16px;overflow:hidden;background:#fff;border:1px solid var(--line)}
.fx .fimg{background:linear-gradient(135deg,#d9d9d9,#f0f0f0);min-height:280px;position:relative}
.fx .fimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fx .tx{padding:36px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
.shopban{max-width:100%;border-radius:12px;margin-top:18px}
.cta2{position:relative;border-radius:16px;overflow:hidden;background:linear-gradient(120deg,#D7282F,#8c1214);color:#fff;padding:56px 40px}
.cta2>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cta2::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.6),rgba(0,0,0,.1));z-index:1}
.cta2 .in{position:relative;z-index:2;max-width:560px}
.cta2 .btn{background:#fff;color:var(--red)}
footer{background:#fff;border-top:1px solid var(--line)}
footer .fgrid{display:grid;grid-template-columns:1fr 1fr 1fr 1.2fr;gap:24px}
footer .fgrid b{display:block;margin-bottom:8px}
footer .fgrid a{display:block;text-decoration:none;color:var(--grey);padding:3px 0}
footer .hs{background:var(--soft);border-radius:14px;padding:18px;display:flex;gap:14px;align-items:center}
footer .hs img{height:40px}
footer .soc{display:flex;gap:12px;margin-top:12px}
footer .soc img{height:28px}
footer .legal{display:flex;gap:18px;flex-wrap:wrap;margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}
footer .legal a{color:var(--mut);text-decoration:none;font-size:.85rem}
footer .copy{color:var(--mut);font-size:.82rem;margin-top:10px}
@media (max-width:900px){.fx,.qrow,footer .fgrid{grid-template-columns:1fr}.hd1 .row{flex-wrap:wrap;height:auto;padding:10px 20px}.persona{order:3}.util{gap:12px}.hero.photo{min-height:360px}.menurow .menu{display:none}}
</style>
</head>
<body>
<div id="demo"><div class="wrap row">
 <span>Illustrative mock-up for discussion. Not the live SingPost site. All names, prices and times are made up.</span>
 <span class="row" style="gap:8px">
  <label><input type="checkbox" id="hl" onchange="document.body.classList.toggle('hl',this.checked)"> Highlight new</label>
  <span class="jm"><button onclick="document.getElementById('jlist').classList.toggle('open')">Demo journeys</button>
   <div id="jlist">

function qr(seed){let s=0;for(const c of seed)s=(s*31+c.charCodeAt(0))>>>0;const N=21,u=6;let r='';const rnd=()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296};

 for(let y=0;y<N;y++)for(let x=0;x<N;x++){const f=(x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12);if(!f&&rnd()>.5)r+=`<rect x="${x*u}" y="${y*u}" width="${u}" height="${u}" fill="#111"/>`}
 return `<svg viewBox="0 0 ${N*u} ${N*u}" width="150" height="150" style="background:#fff;padding:6px;border-radius:8px" role="img" aria-label="Illustrative QR code">${r}${fin(0,0)}${fin(14,0)}${fin(0,14)}</svg>`}

const XT={tab:null};
function xbSel(id){S.xb.sel[id]=!S.xb.sel[id];render()}
function copyAddr(k){toast(ADR[k][0]+' address copied (illustrative).')}
function xbCalc(){const ps=PK.filter(p=>S.xb.sel[p.id]);const kg=ps.reduce((a,p)=>a+p.kg,0);const val_=ps.reduce((a,p)=>a+p.v,0);const ship=12+6*kg;const gst=val_*0.09;const adj={home:0,locker:-1,po:-1}[S.xb.dlv];return {ps,kg,ship,gst,adj,tot:ship+gst+adj}}
function xbOpt(k){S.xb.dlv=k;render()}
function xbGo(s){S.xb.stage=s;render();window.scrollTo(0,0)}
function xoSet(k,v){S.xb.o[k]=v;render()}
function xoRead(){const o=S.xb.o;o.dest=val('xo-d')||o.dest;o.kg=parseFloat(val('xo-k'))||1;o.type=val('xo-t')||o.type;o.stage='opts';render()}
function xoDecl(){S.xb.o.stage='decl';render()}
function xoPay(){const o=S.xb.o;o.desc=val('xo-desc')||'Gift';o.val=val('xo-val')||'30';o.stage='done';o.code='SP-'+Math.random().toString(36).slice(2,8).toUpperCase();render();window.scrollTo(0,0)}
const DF={Malaysia:1,Australia:1.8,'United States':2.2,'United Kingdom':2.2,Japan:1.6,China:1.5};
const XO=[['eco','Economy','7 to 12 days','Tracked at key points',8,3.5],['std','Standard','4 to 7 days','Tracked end to end',11,4.5],['exp','Express','2 to 4 days','Tracked end to end, priority customs',18,7]];
const xoPrice=(r,o)=>r[4]+r[5]*o.kg*DF[o.dest];
V.xb=()=>{const x=S.xb;const tabs=`<div class="tabs" role="tablist"><button class="${x.tab==='in'?'on':''}" onclick="openXB('in')">Shop and ship in (vPost)</button><button class="${x.tab==='out'?'on':''}" onclick="openXB('out')">Send overseas</button></div>`;
 let body='';
 if(x.tab==='in'){
  if(!S.user)body=`<div class="panel"><h1>vPost</h1><p>Shop overseas stores that do not ship to Singapore. Get free overseas addresses, we receive and consolidate your orders, then deliver to you.</p><div class="btns"><button class="btn lg" onclick="startSignup(['vpost'])">Sign up with SingPost ID</button><button class="btn ghost lg" onclick="go('login')">Log in</button></div></div>`;
  else if(!S.user.services.vpost)body=`<div class="panel"><h1>Get your free overseas addresses</h1><p>You are signed in. Activate vPost with one tap. No new form.</p><button class="btn lg" onclick="switchTo('vpost')">Activate vPost</button></div>`;
  else if(x.stage==='list'){const n=Object.values(x.sel).filter(Boolean).length;
   body=`<h1>vPost</h1><p class="mut">Hi ${esc(first())}. Shop at overseas stores, we receive, consolidate and deliver.</p><h2>Your overseas addresses</h2><div class="grid4">${Object.keys(ADR).map(k=>`<div class="addr"><b>${ADR[k][0]}</b><span>${ADR[k][1]}<br>${ADR[k][2]}</span><button class="btn ghost" style="padding:6px 12px" onclick="copyAddr('${k}')">Copy address</button></div>`).join('')}</div><p class="mut small">Illustrative addresses and country list.</p>
   <h2 style="margin-top:26px">At the vPost warehouse<span class="nw">New</span></h2><div class="newbox">${PK.map(p=>`<div class="prow"><label style="display:flex;gap:12px;align-items:center"><input type="checkbox" ${x.sel[p.id]?'checked':''} ${p.st==='arrived'?'':'disabled'} onchange="xbSel('${p.id}')"><span><b>${p.d}</b><span class="mut small">${p.m} &middot; ${p.kg} kg</span></span></label><span class="chip ${p.st==='arrived'?'ok':''}">${p.st==='arrived'?'Arrived at warehouse':'On its way to warehouse'}</span></div>`).join('')}</div>
   <div class="bar"><span>${n?`<b>${n} item${n>1?'s':''} selected.</b> Ship together to save on shipping.`:'Select items that have arrived to ship them together.'}</span><button class="btn lg" ${n?'':'disabled'} onclick="xbGo('ship')">Ship together</button></div>`}
  else if(x.stage==='ship'){const c=xbCalc();
   body=`<h1>Ship together</h1><p class="mut">${c.ps.map(p=>p.d).join(' + ')} &middot; ${c.kg.toFixed(1)} kg combined</p><h2>Delivery</h2>${[['home','To my home','Delivered to Blk 123 Example Street'],['locker','To a locker','Collect any time. Saves S$1.00'],['po','Collect at a post office','Saves S$1.00']].map(([k,n,d])=>`<button class="opt ${x.dlv===k?'on':''}" onclick="xbOpt('${k}')"><span class="mk">${x.dlv===k?I.check:''}</span><span><b>${n}</b><span class="d">${d}</span></span></button>`).join('')}
   <div class="panel" style="margin-top:14px"><div class="prow" style="border:0;padding:4px 0;margin:0"><span>Shipping to Singapore</span><b>${money(c.ship)}</b></div><div class="prow" style="border:0;padding:4px 0;margin:0"><span>GST estimate\u2020</span><b>${money(c.gst)}</b></div>${c.adj?`<div class="prow" style="border:0;padding:4px 0;margin:0"><span>Locker or post office saving</span><b>-S$1.00</b></div>`:''}<div class="prow" style="border:0;padding:8px 0 0;margin:0"><b>Total, one payment</b><b>${money(c.tot)}</b></div></div>
   <p class="mut small">\u2020 Illustrative estimate. GST and duty treatment to be confirmed with Finance before client use.</p><div class="btns"><button class="btn ghost" onclick="xbGo('list')">Back</button><button class="btn lg" onclick="xbGo('done')">Pay ${money(c.tot)}</button></div>`}
  else{body=`<div class="okbox">${I.check} Paid. One parcel is on its way</div><h1>Your parcel journey</h1><div class="panel newbox">${tlHtml([{s:'done',t:'Items received at vPost warehouse',w:'US'},{s:'done',t:'Consolidated into one parcel',w:'Saved vs shipping separately'},{s:'now',t:'Departed origin',w:'Flight booked'},{s:'',t:'Arrived in Singapore, customs clearance',w:'We update you automatically'},{s:'',t:x.dlv==='home'?'Out for delivery':'Ready to collect',w:x.dlv==='home'?'To your address':'We message you with a pickup code'}])}</div><div class="btns"><button class="btn ghost" onclick="S.xb.sel={};xbGo('list')">Back to vPost</button></div>`}
 }else{
  if(!S.user)return needLogin();
  const o=x.o;
  if(o.stage==='form')body=`<h1>Send overseas</h1><p class="mut">See prices and duties before you commit.</p><div class="panel"><div class="grid3"><div class="f"><label for="xo-d">Destination</label><select id="xo-d">${Object.keys(DF).map(k=>`<option ${o.dest===k?'selected':''}>${k}</option>`).join('')}</select></div><div class="f"><label for="xo-k">Weight (kg)</label><input id="xo-k" type="number" min="0.1" step="0.1" value="${o.kg}"></div><div class="f"><label for="xo-t">What are you sending?</label><select id="xo-t"><option value="goods" ${o.type==='goods'?'selected':''}>Goods or gift</option><option value="docs" ${o.type==='docs'?'selected':''}>Documents</option></select></div></div><button class="btn lg" onclick="xoRead()">Compare services</button></div>`;
  if(o.stage==='opts')body=`<h1>${esc(o.dest)} &middot; ${o.kg} kg</h1><p class="mut">Illustrative prices and transit times.</p>${XO.map(r=>`<button class="opt ${o.opt===r[0]?'on':''}" onclick="xoSet('opt','${r[0]}')"><span class="mk">${o.opt===r[0]?I.check:''}</span><span><b>${r[1]}</b><span class="d">${r[2]} &middot; ${r[3]}${o.type==='goods'?' &middot; Duties and taxes estimate shown at the next step':''}</span></span><span class="pr">${money(xoPrice(r,o))}</span></button>`).join('')}<div class="btns"><button class="btn ghost" onclick="xoSet('stage','form')">Back</button><button class="btn lg" ${o.opt?'':'disabled'} onclick="xoDecl()">Continue</button></div>`;
  if(o.stage==='decl'){const r=XO.find(z=>z[0]===o.opt);body=`<h1>Customs details</h1><p class="mut">We fill the declaration form from this. No paper form.</p><div class="panel"><div class="f"><label for="xo-desc">What is inside?</label><input id="xo-desc" value="${esc(o.desc)}"></div><div class="f"><label for="xo-val">Value (S$)</label><input id="xo-val" inputmode="decimal" value="${esc(o.val)}"></div><div class="prow" style="border:0;padding:0;margin:0 0 8px"><span>${r[1]} to ${esc(o.dest)}</span><b>${money(xoPrice(r,o))}</b></div><p class="mut small">Duties and taxes in ${esc(o.dest)} are estimated on the declared value and shown at checkout (illustrative).</p></div><div class="btns"><button class="btn ghost" onclick="xoSet('stage','opts')">Back</button><button class="btn lg" onclick="xoPay()">Pay and get drop-off code</button></div>`}
  if(o.stage==='done'){const r=XO.find(z=>z[0]===o.opt);body=`<div class="okbox">${I.check} Paid ${money(xoPrice(r,o))}</div><h1>Drop it off, then follow it all the way</h1><div class="qrbox newbox"><div>${qr(o.code)}</div><div><div class="code">${o.code}</div><p class="mut small">Illustrative QR. Scan at drop-off.</p></div></div><h3 style="margin-top:22px">What you will see, end to end</h3><div class="panel">${tlHtml([{s:'now',t:'Waiting for drop-off',w:'Show your code at a drop-off point'},{s:'',t:'Processed in Singapore',w:''},{s:'',t:'Departed Singapore',w:''},{s:'',t:'Arrived in '+o.dest+', customs',w:'Duties shown if any'},{s:'',t:'With destination carrier',w:''},{s:'',t:'Delivered',w:''}])}</div><div class="btns"><button class="btn ghost" onclick="openXB('out')">Send another</button></div>`}
 }
 return `<section class="wrap pg">${S.user||x.tab==='in'?tabs:''}${body}</section>`};

/* ---------- Shop ---------- */
const PRODS=[['Padded mailers, pack of 10',4.5],['Medium boxes, pack of 5',6.9],['Bubble wrap roll',7.5],['Collectible stamp sheet',5],['Postcard set',6],['Gift tote',12.9]];
function addCart(p){S.cart+=p;S.p.ordered=false;render()}
V.shop=()=>`<section class="wrap pg"><div class="ph"><h1>Shop@SingPost</h1><p class="mut">Stamps, packing materials and gifts. ${S.user?'Signed in with your SingPost ID. Saved address and payment are ready.':'<a href="#" onclick="return go(\'login\')">Log in</a> for faster checkout.'}</p></div>
 ${S.p.ordered?`<div class="okbox">${I.check} Order placed. Packing materials on the way. <button class="btn" style="margin-left:10px;padding:6px 14px" onclick="startSend()">Ready to post? Send a parcel</button></div>`:''}
 <div class="grid3">${PRODS.map(p=>`<div class="prod"><div class="ph1">Product image</div><div class="b"><b>${p[0]}</b><div class="mut small">${money(p[1])} (illustrative)</div><button class="btn ghost" style="margin-top:8px;padding:6px 14px" onclick="addCart(${p[1]})">Add to cart</button></div></div>`).join('')}</div>
 <div class="bar"><span><b>Cart ${money(S.cart)}</b></span><button class="btn lg" ${S.cart?'':'disabled'} onclick="if(!S.user){go('login');return}S.cart=0;S.p.ordered=true;render()">${S.user?'Pay with saved details':'Log in to check out'}</button></div></section>`;

/* ---------- Cases ---------- */
V.cases=()=>!S.user?needLogin():`<section class="wrap pg"><div class="ph"><h1>My cases</h1><p class="mut">One case per issue, whichever channel you used.</p></div>
 ${S.cases.length?S.cases.map(c=>`<div class="panel" style="margin-bottom:14px"><div class="row" style="justify-content:space-between"><h3 style="margin:0">${c.id}</h3><span class="chip warn">With an agent</span></div><p class="mut">${c.sum}</p>${tlHtml([{s:'done',t:'Case created from chat',w:'Details attached. No need to repeat yourself.'},...c.steps.map(t=>({s:'done',t,w:'Done in chat'})),{s:'done',t:'Agent assigned',w:'Just now'},{s:'now',t:'Agent is reviewing',w:'We update you here and on WhatsApp'}])}</div>`).join(''):`<div class="panel"><p>No cases yet. Ask the assistant if a delivery goes wrong.</p><button class="btn" onclick="chatOpen()">Ask the assistant</button></div>`}</section>`;

/* ---------- Journey 6: assistant ---------- */
function chatRender(){const c=S.chat;$('#fab').innerHTML=I.chat+' Help';$('#fab').style.display=c.open?'none':'flex';$('#chat').hidden=!c.open;if(!c.open)return;
 $('#cmsgs').innerHTML=c.msgs.map(m=>`<div class="m ${m.r}">${m.h}</div>`).join('')+(c.typing?'<div class="m b"><span class="typing"><i></i><i></i><i></i></span></div>':'');
 $('#cchips').innerHTML=c.chips.map((t,i)=>`<button onclick="chatChip(${i})">${esc(t)}</button>`).join('');const m=$('#cmsgs');m.scrollTop=m.scrollHeight}
function chatOpen(){const c=S.chat;c.open=true;if(!c.started){c.started=true;bot(`Hi${S.user?' '+esc(first()):''}. I can track a parcel, change a delivery, or pass you to a person with everything already shared.`,300,["Where's my parcel?",'Change my delivery','Talk to a person'])}chatRender();setTimeout(()=>{const i=$('#cin');if(i)i.focus()},50);return false}
function chatClose(){S.chat.open=false;chatRender()}
function bot(h,d,chips,after){S.chat.typing=true;chatRender();setTimeout(()=>{S.chat.msgs.push({r:'b',h});S.chat.typing=false;S.chat.chips=chips||[];chatRender();if(after)after()},d==null?600:d)}
function chatChip(i){const t=S.chat.chips[i];S.chat.chips=[];userSay(t)}
function chatForm(e){e.preventDefault();const i=$('#cin');const t=i.value.trim();if(!t)return false;i.value='';S.chat.chips=[];userSay(t);return false}
function userSay(t){S.chat.msgs.push({r:'u',h:esc(t)});chatRender();intent(t)}
function card(rows){return '<div class="cardx">'+rows.map(r=>`<div><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')+'</div>'}
function intent(t){const s=t.toLowerCase();
 if(/person|agent|human|speak/.test(s))return handoff();
 if(/locker [ab]/.test(s))return done('Moved to '+t.split(' \u00b7')[0],'Locker collection code sent by WhatsApp and SMS');
 if(/redeliver|re-deliver|reschedule|tomorrow/.test(s))return done('Re-delivery booked for tomorrow, 9 am to 1 pm','We message you an hour before arrival');
 if(/post office|collect/.test(s))return done('Held for collection at post office B','Bring ID. Held for 14 days (illustrative)');
 if(/locker/.test(s)){S.chat.parcel=S.chat.parcel||'SP45821390SG';return bot('Two lockers near the address on this parcel (illustrative):',500,['Locker A \u00b7 0.4 km','Locker B \u00b7 0.9 km','Talk to a person'])}
 if(/where|track|status|parcel|change|delivery|sp\d{6,}/.test(s)){S.chat.parcel='SP45821390SG';return bot((S.user?'Found 2 parcels on your account. This one needs action:':'Found it.')+card([['Parcel','SP45821390SG'],['Status','Delivery attempted'],['When','Today, 2:14 pm'],['Reason','Recipient not home']])+'<div style="margin-top:8px">How would you like to fix it?</div>',700,['Re-deliver tomorrow','Send to a locker','Collect at post office','Talk to a person'])}
 if(/^(yes|thanks|thank|sorted|solved)/.test(s))return bot('Good. You will get an update before delivery. Anything else?',500,["Where's my parcel?",'Talk to a person']);
 bot('I can help with tracking, changing a delivery, or sending you to a person. Pick one:',500,["Where's my parcel?",'Change my delivery','Talk to a person'])}
function done(what,sub){S.chat.steps.push(what);bot('<b>Done.</b> '+what+'.'+card([['Next',sub],['Updated','Delivery team and you']])+'<div style="margin-top:8px">Is that sorted?</div>',800,["Yes, that's sorted",'No, I need a person'])}
function handoff(){const c=S.chat;const no=c.parcel||'SP45821390SG';const id='CS-'+(260000+Math.floor(Math.random()*9999));
 S.cases.unshift({id,sum:'Delivery problem on '+no,steps:[...c.steps]});
 bot('Passing you to an agent. You will not need to repeat anything. This is what they see:'+card([['Case',id],['Customer',S.user?esc(S.user.name):'Guest'],['Parcel',no],['Done in chat',c.steps.length?esc(c.steps.join('; ')):'Nothing yet']]),700,[],()=>{
  c.typing=true;chatRender();setTimeout(()=>{c.msgs.push({r:'s',h:'Agent joined (demo)'});c.msgs.push({r:'b',h:`Hi ${S.user?esc(first()):'there'}. I have your parcel and what you already tried. How can I help from here?`});c.typing=false;c.chips=['View my case'];chatRender()},1400)})}
const _intent=intent;intent=function(t){if(/view my case/i.test(t)){go('cases');return}_intent(t)};

/* ---------- render + jump ---------- */
function render(){hdr();svcbar();$('#view').innerHTML=(V[S.view]||V.home)();ftr();chatRender()}
function jump(k){$('#jlist').classList.remove('open');
 if(k==='0a'){S.user=null;S.biz=newBiz();return startSignup()}
 if(k==='0b'){S.user=null;S.biz=newBiz();return go('login')}
 ensureLogin();
 if(k==='0c'){go('mypost');setTimeout(()=>toggleDD('acct'),60)}
 if(k==='2')startSend();
 if(k==='3'){S.biz=newBiz();S.user.services.biz=false;go('bizonb')}
 if(k==='4')openXB('in');
 if(k==='6'){go('home');chatOpen()}}
render();
</script>
</body>
</html>
