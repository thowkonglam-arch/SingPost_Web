<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SingPost app decision matrix: due diligence view</title><style>
:root{
  --ink:#262626; --ink2:#404040; --muted:#666666; --paper:#f2f2f2; --card:#ffffff; --line:#d9d9d9; --line2:#ececec;
  --red:#bd2426; --redsoft:#fbe9ea; --pos:#1d6b4f; --possoft:#e1f1ea; --neg:#8e1b1d; --negsoft:#fbe4e6;
  --Build:#bd2426; --Extend:#8c8c8c; --Buy:#404040; --Retire:#e8b0b1; --Retain:#d9d9d9;
  --serif:Arial,Helvetica,sans-serif; --sans:Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--red)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}

.top{background:var(--ink);color:#fff;padding:18px 28px 14px;display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap;border-bottom:4px solid var(--red)}
.top h1{font:700 22px/1.2 var(--serif);margin:0;letter-spacing:.2px}
.top .sub{color:#d9d9d9;margin-top:4px;max-width:760px;font-size:13px}
.top .grow{flex:1;min-width:260px}
.search{position:relative;min-width:300px}
.search input{width:100%;padding:9px 12px;border-radius:6px;border:1px solid #595959;background:#404040;color:#fff;font:inherit}
.search input::placeholder{color:#bfbfbf}
.results{position:absolute;right:0;left:0;top:100%;margin-top:4px;background:#fff;color:var(--ink);border-radius:8px;box-shadow:0 12px 32px rgba(14,27,51,.28);max-height:360px;overflow:auto;z-index:40;display:none}
.results.on{display:block}
.results button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:8px 12px;border-bottom:1px solid var(--line2)}
.results button:hover,.results button:focus-visible{background:#f7f7f7}

.tabsWrap{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.tabs{display:flex;gap:2px;overflow-x:auto;padding:0 20px;scrollbar-width:thin}
.tabs button{border:0;background:none;padding:11px 14px;white-space:nowrap;border-bottom:3px solid transparent;color:var(--ink2);font-weight:600;font-size:13px}
.tabs button:hover{color:var(--ink);background:#f7f7f7}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--red)}
.tabs .sep{width:1px;background:var(--line);margin:8px 8px;flex:none}
.tabs .cnt{display:inline-block;margin-left:6px;font-size:11px;background:#e9e9e9;border-radius:10px;padding:0 7px;color:var(--ink2)}
.apptabs{background:#f7f7f7;border-top:1px solid var(--line2)}
.apptabs button{font-weight:500;padding:8px 12px;font-size:13.5px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:baseline;border:1px solid rgba(0,0,0,.18)}

main{max-width:1240px;margin:0 auto;padding:22px 24px 80px;position:relative}
h2{font:400 22px/1.25 var(--serif);margin:0 0 6px}
.lede{color:var(--ink2);max-width:900px;margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px}
.card h3.t{font:600 12px/1.3 var(--sans);text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:0 0 10px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:1fr}}
@media(max-width:560px){.g4{grid-template-columns:1fr}main{padding:16px 12px 70px}.top{padding:14px 14px 12px}}

.chip{display:inline-flex;align-items:center;gap:6px;border-radius:5px;padding:2px 9px;font-weight:700;font-size:12px;letter-spacing:.3px}
.chip.Build{background:var(--Build);color:#fff}.chip.Extend{background:var(--Extend);color:#fff}.chip.Buy{background:var(--Buy);color:#fff}.chip.Retire{background:var(--Retire);color:var(--ink)}.chip.Retain{background:var(--Retain);color:var(--ink)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:0 7px;font-size:12px;color:var(--ink2);background:#fff;margin:0 4px 4px 0}
.muted{color:var(--muted)}
.small{font-size:13.5px}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 9px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line2)}
th{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600;background:#f7f7f7}
.tw{overflow-x:auto}
tr.link{cursor:pointer}
tr.link:hover td{background:#f7f7f7}
.appbtn{border:1px solid var(--line);background:#fff;border-radius:14px;padding:1px 9px;font-size:12px}
.appbtn:hover{border-color:var(--red);color:var(--red)}

.apphead{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}
.apphead h2{margin:0}
.meta{color:var(--ink2);font-size:13px;margin-top:4px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.fact{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.fact .l{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}
.fact .v{font-weight:700;font-size:15px;margin-top:2px}
.fact .s{font-size:12px;color:var(--ink2)}
.cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:16px;align-items:start}
@media(max-width:1060px){.cols2{grid-template-columns:1fr}}
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:58px 1fr 52px;gap:8px;align-items:center;font-size:13.5px}
.track{height:20px;background:#ececec;border-radius:4px;position:relative;overflow:hidden}
.fill{position:absolute;top:0;bottom:0;border-radius:4px}
.fill.ro{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.55) 0 4px,transparent 4px 8px)!important;opacity:.7}
.zero{position:absolute;top:-2px;bottom:-2px;width:1px;background:#808080}
.bar.win .lb,.bar.win .val{font-weight:700}

.lev{width:100%;table-layout:fixed;min-width:760px}
.lev th:nth-child(1){width:27%}.lev th:nth-child(3){width:150px}.lev th:nth-child(4){width:62px}
.lev tr.grp td{background:#f2f2f2;font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink2);font-weight:700;padding:5px 9px}
.lev tr.row{cursor:pointer}
.lev tr.row:hover td{background:#f7f7f7}
.lev tr.row.sel td{background:#fbeaea}
.lev tr.row.na td,.lev tr.row.blank td{color:var(--muted)}
.lev .q{font-weight:700}
.ans{display:flex;gap:8px;align-items:flex-start}
.ansn{flex:none;width:22px;height:22px;border-radius:5px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
.ansn.s1{background:#fbeaea;color:var(--ink)}.ansn.s2{background:#f1c4c5;color:var(--ink)}.ansn.s3{background:#e08a8c;color:#262626}.ansn.s4{background:#262626;color:#fff}
.anst{font-size:13.5px;line-height:1.35}
.pts{display:flex;gap:3px}
.pt{width:27px;text-align:center;border-radius:4px;font-size:12px;font-weight:700;padding:2px 0;background:#ececec;color:var(--muted);font-variant-numeric:tabular-nums}
.pt.pos{background:var(--possoft);color:var(--pos)}.pt.neg{background:var(--negsoft);color:var(--neg)}
.pt.ro{background:repeating-linear-gradient(45deg,#e8e5dc 0 3px,#f6f4ee 3px 6px);color:#555}
.pt.win{box-shadow:0 0 0 2px var(--ink)}
.pthead{display:flex;gap:3px}
.pthead span{width:27px;text-align:center;font-size:10.5px;font-weight:700;color:var(--ink2)}
.pthead i{display:block;height:4px;border-radius:2px;margin-bottom:2px}
.eff{font-weight:700;white-space:nowrap;font-size:13.5px}
.eff.p{color:var(--pos)}.eff.n{color:var(--neg)}.eff.z{color:var(--muted)}
.flag{display:inline-block;font-size:11px;border-radius:4px;padding:0 5px;margin-left:4px;font-weight:700}
.flag.key{background:#fbeaea;color:#8e1b1d}
.flag.rs{background:var(--redsoft);color:var(--neg)}
tfoot td{font-weight:700;border-top:2px solid var(--ink);background:#f7f7f7}

.remark{margin:0 0 12px}
.remark h4{margin:0 0 3px;font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}
.remark p{margin:0}
ul.as{margin:0;padding-left:18px}
ul.as li{margin:0 0 6px}
ul.as.two{columns:2;column-gap:32px}@media(max-width:900px){ul.as.two{columns:1}}ul.as.two li{break-inside:avoid}
.note{background:#fbeaea;border:1px solid #e8b0b1;border-radius:8px;padding:9px 12px;font-size:13.5px}
.hint{display:flex;gap:8px;align-items:center;color:var(--ink2);font-size:13.5px;margin:0 0 8px}
.hint kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:#fff;font:12px var(--sans)}

.gridt td,.gridt th{padding:4px 5px;text-align:center;font-size:12px}
.gridt td.nm,.gridt th.nm{text-align:left;white-space:nowrap}
.gridt tr.grp td{background:#f2f2f2;font-weight:700;text-align:left;text-transform:uppercase;font-size:11px;letter-spacing:.6px;color:var(--ink2)}
.gcell{width:26px;height:24px;border-radius:4px;border:0;font-weight:700;font-size:12px}
.gcell.s1{background:#fbeaea}.gcell.s2{background:#f1c4c5}.gcell.s3{background:#e08a8c;color:#262626}.gcell.s4{background:#262626;color:#fff}
.gcell.blank{background:#fff;border:1px dashed #bfbfbf;color:#aaa}
.gcell.na{background:#ececec;color:#aaa;cursor:default}
.gcell.rs{outline:2px solid var(--red);outline-offset:-2px}
.gcell:hover:not(.na){filter:brightness(.92)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:0 0 10px;align-items:center}
.legend i{display:inline-block;width:16px;height:16px;border-radius:4px;vertical-align:middle;margin-right:5px}

.callout{position:absolute;z-index:60;width:min(560px,calc(100vw - 24px));background:#fff;border:1px solid #bfbfbf;border-radius:12px;box-shadow:0 18px 50px rgba(14,27,51,.30);padding:0;display:none}
.callout.on{display:block}
.callout .arrow{position:absolute;top:-8px;width:14px;height:14px;background:#fff;border-left:1px solid #bfbfbf;border-top:1px solid #bfbfbf;transform:rotate(45deg)}
.co-head{display:flex;gap:10px;align-items:flex-start;padding:14px 16px 8px;border-bottom:1px solid var(--line2)}
.co-head h3{font:400 17px/1.25 var(--serif);margin:2px 0 0;flex:1}
.co-theme{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:700}
.co-x{border:0;background:#ececec;border-radius:50%;width:28px;height:28px;font-size:18px;line-height:1}
.co-x:hover{background:var(--redsoft);color:var(--red)}
.co-body{padding:10px 16px 16px;max-height:min(70vh,640px);overflow:auto}
.co-body .sec{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:700;margin:12px 0 5px}
.co-body p{margin:0 0 6px}
.opts{list-style:none;padding:0;margin:0;display:grid;gap:5px}
.opts li{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;border:1px solid var(--line2);border-radius:7px;padding:5px 7px;font-size:13.5px;line-height:1.35}
.opts li.sel{border-color:var(--ink);background:#fbeaea;box-shadow:0 0 0 1px var(--ink) inset}
.opts li .n{width:20px;height:20px;border-radius:5px;background:#e9e9e9;display:grid;place-items:center;font-weight:700;font-size:12px}
.opts li.sel .n{background:var(--ink);color:#fff}
.verdict{border-radius:8px;padding:9px 11px;font-size:13px}
.verdict.p{background:var(--possoft)}.verdict.n{background:var(--negsoft)}.verdict.z{background:#ececec}
.scrim{display:none}
@media(max-width:700px){
  .callout{position:fixed!important;left:8px!important;right:8px!important;bottom:8px!important;top:auto!important;width:auto}
  .callout .arrow{display:none}
  .scrim.on{display:block;position:fixed;inset:0;background:rgba(14,27,51,.4);z-index:55}
}
@media print{.tabsWrap,.search,.callout{display:none!important}.card{break-inside:avoid}}

.bar .val{white-space:nowrap}
.apphead{margin-bottom:10px}.why p{margin:0 0 5px}.why p:last-child{margin:0}
.why p.wl{margin:0 0 6px}.why .lb{font-weight:700;letter-spacing:.1px}.why .Lw{color:#8e1b1d}.why .Lx{color:#262626}.why .Lt{color:#4b1e78}.why .Ln{color:#404040}.why mark{background:linear-gradient(transparent 58%,#fbe9ea 58%);color:inherit;font-weight:600;padding:0 1px}

.facts{grid-template-columns:repeat(auto-fit,minmax(170px,240px))}
.rat{background:#f7f7f7;border-left:3px solid var(--ink);border-radius:6px;padding:9px 11px;font-size:13px;line-height:1.5}

/* ---- v12 professional theme ---- */
html{font-size:15px}
body{background:#f4f4f4;color:#262626;font:15px/1.6 Arial,Helvetica,sans-serif}
.top{background:#fff;color:#262626;border-top:5px solid #bd2426;border-bottom:1px solid #e0e0e0;padding:20px 36px;display:flex;align-items:center;gap:32px}

.top h1{font:700 24px/1.25 Arial,Helvetica,sans-serif;color:#262626;margin:0}
.top h1::before{content:"SINGPOST  \00b7   APPLICATION DISPOSITION";display:block;font:700 11px/1 Arial;letter-spacing:.14em;color:#bd2426;margin:0 0 8px}

.search{min-width:300px}

.search input::placeholder{color:#8a8a8a}
.results{background:#fff;border:1px solid #d6d6d6;box-shadow:0 8px 24px rgba(0,0,0,.12);color:#262626}
.tabsWrap{background:#fff;border-bottom:1px solid #e0e0e0;box-shadow:none}
.tabs{padding:0 28px;gap:2px}
.tabs button{font:600 13.5px Arial;color:#595959;padding:14px 16px;border-bottom:3px solid transparent;background:none}
.tabs button:hover{color:#bd2426;background:#fafafa}
.tabs button[aria-selected=true]{color:#bd2426;border-bottom-color:#bd2426}

.apptabs button{font:500 13px Arial;color:#595959;padding:11px 14px}
.apptabs button[aria-selected=true]{color:#262626;font-weight:700;border-bottom:3px solid #262626}
main{max-width:1180px;padding:32px 28px 100px}
h2{font:700 28px/1.2 Arial;color:#262626;margin:0 0 10px}
.lede{font-size:15px;color:#595959;max-width:820px;margin:0 0 20px}
.apphead{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.apphead h2{font-size:28px;margin:0}
.card{background:#fff;border:1px solid #e0e0e0;border-radius:6px;box-shadow:none;padding:22px 26px;margin-bottom:20px}
.card h3.t{font:700 16px/1.3 Arial;color:#262626;text-transform:none;letter-spacing:0;border:0;margin:0 0 14px;padding:0}
.card h3.t::before{content:"";display:block;width:28px;height:3px;background:#bd2426;margin:0 0 9px}
.facts{gap:12px}
.fact{background:#fff;border:1px solid #e0e0e0;border-radius:6px;box-shadow:none;padding:12px 16px}
.fact .l{font:700 11px Arial;letter-spacing:.08em;text-transform:uppercase;color:#808080}
.fact .v{font:700 18px Arial;color:#262626}
th{background:#fafafa;color:#595959;font:700 11.5px Arial;letter-spacing:.07em;text-transform:uppercase;padding:11px 14px;border-bottom:1px solid #e0e0e0}
td{padding:14px;border-bottom:1px solid #eee;font-size:14px;vertical-align:top}
tr.link:hover td{background:#fbeaea}
.card.tw>table:not(.lev):not(.gridt){table-layout:fixed;width:100%}.card.tw>table:not(.lev):not(.gridt) th:nth-child(1){width:190px}.card.tw>table:not(.lev):not(.gridt) th:nth-child(2){width:92px}.card.tw>table:not(.lev):not(.gridt) .why{max-width:none}
.card.tw>table:not(.lev):not(.gridt) td:first-child,.card.tw>table:not(.lev):not(.gridt) .appbtn{white-space:normal;overflow-wrap:break-word;text-align:left;line-height:1.35}

.mixbar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:0 0 20px;background:#e5e5e5}

/* ---- v13: by decision and solution landscape ---- */
.dcols{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:start}
@media(max-width:1100px){.dcols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.dcols{grid-template-columns:1fr}}
.dh{border-radius:4px;padding:12px 14px;color:#fff}.dh b{display:block;font:700 17px Arial}.dh span{font-size:13px}
.dh.Build{background:#bd2426}.dh.Buy{background:#404040}.dh.Extend{background:#8c8c8c}.dh.Retire{background:#e8b0b1;color:#262626}.dh.Retain{background:#d9d9d9;color:#262626}
.dcol ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}
.dcol li button{width:100%;text-align:left;background:#fff;border:1px solid #ececec;border-radius:3px;padding:7px 10px;font-size:13.5px;line-height:1.3}
.dcol li button:hover,.dcol li button:focus-visible{background:#fbe9ea;color:#8e1b1d;border-color:#e8b0b1}
.dcol li small{display:block;color:#808080;font-size:11px;margin-top:1px}
.lstep{display:flex;gap:2px;margin:0 0 12px;overflow-x:auto}
.lstep button{flex:1 1 0;min-width:200px;border:0;background:#e3e3e3;color:#595959;font:700 14px Arial;padding:12px 28px 12px 34px;white-space:nowrap;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 50%,calc(100% - 18px) 100%,0 100%,18px 50%)}
.lstep button:first-child{padding-left:20px;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 50%,calc(100% - 18px) 100%,0 100%)}
.lstep button:hover{background:#d4d4d4}
.lstep button.on{background:#bd2426;color:#fff}
.lleg{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:#404040;margin:0 0 10px;align-items:center}
.lleg i.lk{display:inline-block;width:30px;height:16px;border-radius:2px;vertical-align:middle;margin-right:6px;background:#fff;border:1.5px solid #8c8c8c}
.lleg i.lk.chg{border:1.5px dashed #bd2426;background:#fbe9ea}.lleg i.lk.new{border:2px solid #bd2426}
.lleg .dotk{white-space:nowrap}
.lboard{min-width:1080px;display:grid;grid-template-columns:minmax(0,1fr) 205px;gap:8px;align-items:stretch}
.lleft{display:grid;gap:8px;align-content:start}
.lrow1{display:grid;grid-template-columns:29fr 9fr 15fr 25fr 14fr 12fr;gap:5px}
.lrow2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.lz.grey{background:#ececec;border-color:#dcdcdc}.lz.grey .zt{color:#262626}
.zb{display:grid;gap:6px;padding:0 8px;align-content:start}

.zb.row{grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}
.zsub{display:grid;gap:6px;align-content:start}.zsub .sl{font:700 11.5px Arial;color:#404040;padding:0 1px}
.bx{display:flex;position:relative;align-items:center;justify-content:center;flex-direction:column;gap:4px;text-align:center;min-height:36px;width:100%;padding:7px 9px;background:#fff;border:1.5px solid #8c8c8c;border-radius:2px;font:13px/1.25 Arial;color:#262626}

</style></head><body><header class="top"><div class="grow"><h1>SingPost app decision matrix: due diligence view</h1><div class="sub">The 51 scored apps by decision, on the solution landscape and by domain. For each app: why the decision was made, the answer to every one of the 16 levers with the reason for that answer, the points and the assumptions in place.</div></div><div class="search"><label class="sr" for="q">Find an app</label><input id="q" type="search" placeholder="Find an app&hellip;" autocomplete="off"><div class="results" id="results" role="listbox"></div></div></header><div class="tabsWrap"><nav class="tabs" id="mainTabs" role="tablist" aria-label="Domains and reference pages"></nav><nav class="tabs apptabs" id="appTabs" role="tablist" aria-label="Apps in the domain" hidden></nav></div><main id="view" tabindex="-1"></main><div class="scrim" id="scrim"></div><div class="callout" id="callout" role="dialog" aria-modal="false" aria-labelledby="coTitle"></div><script id="data" type="application/json">{"apps": [{"id": "T001", "name": "Domestic shipping core (HypaShip)", "short": "Domestic shipping core (HypaShip)", "domain": "D2", "type": "Product", "decision": "Build", "result": "Build", "second": "Extend", "pts": [-8, 10, 5, 19, -3], "ro": [0, 0, 0, 0, 0], "levers": [{"q": 1, "a": 1, "pts": [1, 2, -2, 3, -1], "ro": [0, 0, 0, 0, 0], "sw": 1, "rat": "HypaShip is the vendor-managed platform that runs domestic parcel scan, routing and proof of delivery. Customers and contracts depend on this capability and competitors do not offer it in the same way, so it is read as a differentiator. Assumption: based on the roadmap and service descriptions; to be confirmed against customer contracts and win and loss reasons. That points towards owning the capability (Build) rather than buying it.", "key": false}, {"q": 2, "a": 2, "pts": [0, 1, 1, 0, 0], "ro": [0, 0, 0, 0, 0], "sw": -1, "rat": "One or two constraints (vendor-held code and data access) would have to be negotiated or changed before a standard product fits HypaShip. Assumption: constraints taken from the architecture material.", "key": false}, {"q": 3, "a": 3, "pts": [-2, 1, 1, 2, 1], "ro": [0, 0, 0, 0, 0], "sw": 1, "rat": "More than 30% of the steps rely on workarounds because changes are slow, tightly coupled and held up by vendor customisations. Assumption: the share is judged from the process material and to be validated with the owner.", "key": false}, {"q": 4, "a": 3, "pts": [-2, 1, 2, 2, 0], "ro": [0, 0, 0, 0, 0], "sw": 1, "rat": "HypaShip partly fits: between 40% and 75% of the future needs run, and to launch the B2B and healthcare pilots, robots and AI agents on one scan-once platform it needs significant change or new modules. Assumption: future needs are taken from the process sessions and the roadmap. That points towards change rather than keeping it unchanged.", "key": false}, {"q": 5, "a": 1, "pts": [-1, 2, 1, 2, -2], "ro": [0, 0, 0, 0, 0], "sw": 0, "rat": "Strong growth is expected (over 30% or new channels): domestic parcel volumes keep growing with e-commerce and the new B2B and healthcare segments. Assumption: read from the business forecast and roadmap; no app-level volume forecast was available. Strong growth needs a platform that can extend.", "key": false}, {"q": 6, "a": null, "state": "na"}, {"q": 7, "a": 3, "pts": [-2, -1, 2, 2, 1], "ro": [0, 0, 0, 0, 0], "sw": 3, "rat": "A vendor-managed product whose customisations block upgrades: it is still supported, but customisations block upgrades or the roadmap does not cover SingPost needs. Assumption: desk-based reading of the vendor and version position, held as a working assumption.", "key": true}, {"q": 8, "a": 3, "pts": [-3, -1, 2, 2, 1], "ro": [0, 0, 0, 0, 0], "sw": 3, "rat": "Incidents are frequent or fail at peak because changes are slow, tightly coupled and held up by vendor customisations. Assumption: read from the support notes and architecture review; the incident log is to be confirmed.", "key": true}, {"q": 9, "a": 3, "pts": [-2, -2, 0, 1, 1], "ro": [0, 0, 0, 0, 0], "sw": 3, "rat": "Changes take over eight weeks or force regression across unrelated functions because changes are slow, tightly coupled and held up by vendor customisations. Assumption: release records not reviewed; to be confirmed.", "key": true}, {"q": 10, "a": 2, "pts": [0, 2, 0, 1, 0], "ro": [0, 0, 0, 0, 0], "sw": -1, "rat": "HypaShip (its hosting is not captured in the catalog) has under 30% headroom at forecast peak or needs tuning to add capacity. Assumption: no load test was reviewed; capacity to be confirmed.", "key": false}, {"q": 11, "a": 1, "pts": [1, 2, -3, 3, -2], "ro": [0, 0, 0, 0, 0], "sw": 1, "rat": "Two or three ownership tests apply to HypaShip: the scan, routing and customer data it holds and the hub network it drives. SingPost needs to own and control it. That points towards Build or Extend on a SingPost-owned platform.", "key": false}, {"q": 12, "a": 1, "pts": [1, 1, 0, 0, -2], "ro": [0, 0, 0, 0, 0], "sw": -1, "rat": "Needed and unique: no other SingPost system carries domestic scan and routing. That rules out retiring or merging it.", "key": false}, {"q": 13, "a": 2, "pts": [0, 1, 1, 1, 0], "ro": [0, 0, 0, 0, 0], "sw": 0, "rat": "One or two products exist or they cover only part of the scope: a few delivery-management products exist, but none matches SingPost's hub and handover model. Assumption: product references to be checked against postal operators.", "key": false}, {"q": 14, "a": null, "state": "blank"}, {"q": 15, "a": null, "state": "blank"}, {"q": 16, "a": 2, "pts": [1, 1, 0, 0, 0], "ro": [0, 0, 0, 0, 0], "sw": -1, "rat": "The three-year economics of the cheapest credible change are marginal: owning the architecture costs more up front but removes the vendor dependency and releases features faster within three years. Assumption: the economics view is directional and is confirmed once scope is agreed.", "key": false}], "why": "Key point: Vendor-dependency and monolith\nWhy: HypaShip is the heart of domestic parcel operations and the main way to grow delivery revenue. But it is a vendor-managed monolith, so changes are slow and tightly coupled. The vendor owns the customisations built into it; SingPost only holds a licence to use them, so it cannot take them elsewhere or change them freely.\nProposal: SingPost would build its own domestic shipping core. This cuts dependence on the vendor and lets SingPost own its scan, routing and customer data. It also makes it faster to launch new features such as pilots, robots and AI agents.\nTiming: A design study starts in year 1 (Q3) and the build follows from year 2. Modules cut over in waves (Q10 and Q12).", "stack": null, "hosting": "Not captured in catalog", "answered": 13, "assumptions": ["Module and feature counts (60) and vendor commercial terms are assumed until the Q4 study", "The design study starts in year 1 (Q3) and the build in year 2 (Q5); vendor capacity and the shorter module windows are assumed to allow it"]}, {"id": "T003", "name": "Domestic shipping core (glassRun, B2B)", "short": "Domestic shipping core (glassRun, B2B)", "domain": "D2", "type": "Custom build", "decision": "Build", "result": "Build", "second": "Extend", "pts": [-8, 13, 10, 17, -2], "ro": [0, 0, 0, 0, 0], "levers": [{"q": 1, "a": 1, "pts": [1, 2, -2, 3, -1], "ro": [0, 0, 0, 0, 0], "sw": 1, "rat": "glassRun is the B2B delivery service tool that runs on its own scan and routing data. Customers and contracts depend on this capability and competitors do not offer it in the same way, so it is read as a differentiator. Assumption: based on the roadmap and service descriptions; to be confirmed against customer contracts and win and loss reasons. That points towards owning the capability (Build) rather than buying it.", "key": false}, {"q": 2, "a": 3, "pts": [0, 1, -2, 2, 0], "ro": [0, 0, 0, 0, 0], "sw": 1, "rat": "At least one hard constraint (the B2B service agreements) fixes how SingPost works here, so a standard product would not fit glassRun as it is. That makes a bought product hard to adopt and favours building or extending.", "key": false}, {"q": 3, "a": 2, "pts": [0, 2, 1, 1, 0], "ro": [0, 0, 0, 0, 0], "sw": -1, "rat": "Some steps (10 to 30%) lean on workarounds because it runs in parallel to the core, duplicating scan data and effort. Assumption: the share is judged from the process material and to be validated with the owner.", "key": false}, {"q": 4, "a": 3, "pts": [-2, 1, 2, 2, 0], "ro": [0, 0, 0, 0, 0], "sw": 1, "rat": "glassRun partly fits: between 40% and 75% of the future needs run, and to share one scan-once platform with the core and scale at peak it needs significant change or new modules. Assumption: future needs are taken from the process sessions and the roadmap. That points towards change rather than keeping it unchanged.", "key": true}, {"q": 5, "a": 1, "pts": [-1, 2, 1, 2, -2], "ro": [0, 0, 0, 0, 0], "sw": 0, "rat": "Strong growth is expected (over 30% or new channels): B2B volumes grow as SingPost wins more enterprise customers. Assumption: read from the business forecast and roadmap; no app-level volume forecast was available. Strong growth needs a platform that can extend.", "key": false}, {"q": 6, "a": null, "state": "blank"}, {"q": 7, "a": 3, "pts": [-2, -1, 2, 2, 1], "ro": [0, 0, 0, 0, 0], "sw": 3, "rat": "Custom code with a third-party delivery library: it is still supported, but customisations block upgrades or the roadmap does not cover SingPost needs. Assumption: desk-based reading of the vendor and version position, held as a working assumption.", "key": true}, {"q": 8, "a": null, "state": "blank"}, {"q": 9, "a": 2, "pts": [0, 1, 0, 1, 0], "ro": [0, 0, 0, 0, 0], "sw": 0, "rat": "Changes take two to eight weeks, with partial tests or some regression across neighbouring functions. Assumption: release records not reviewed; to be confirmed.", "key": false}, {"q": 10, "a": 3, "pts": [-3, 0, 1, 2, 1], "ro": [0, 0, 0, 0, 0], "sw": 2, "rat": "glassRun (its hosting is not captured in the catalog) will miss the forecast peak or response targets without redesign. Assumption: no load test was reviewed; to be confirmed.", "key": true}, {"q": 11, "a": 2, "pts": [0, 1, 1, 1, 0], "ro": [0, 0, 0, 0, 0], "sw": 0, "rat": "One ownership test applies to glassRun: SingPost's own B2B scan and routing data and the B2B service rules. A product or partner can run it while SingPost keeps control of data and interfaces.", "key": false}, {"q": 12, "a": 1, "pts": [1, 1, 0, 0, -2], "ro": [0, 0, 0, 0, 0], "sw": -1, "rat": "Needed and unique: the core will absorb its flows, but nothing else serves B2B delivery today. That rules out retiring or merging it.", "key": false}, {"q": 13, "a": 1, "pts": [0, 0, 3, -1, 0], "ro": [0, 0, 0, 0, 0], "sw": -1, "rat": "Three or more proven products exist: delivery-management products exist in the market, but none would hold SingPost's B2B data and rules. Assumption: product references to be checked against postal operators. That keeps Buy realistic.", "key": false}, {"q": 14, "a": 2, "pts": [0, 1, 1, 0, 0], "ro": [0, 0, 0, 0, 0], "sw": -1, "rat": "Run cost is about average, within 20% of comparable options. Assumption: no run cost per transaction was available for glassRun; to be confirmed.", "key": false}, {"q": 15, "a": null, "state": "blank"}, {"q": 16, "a": 1, "pts": [-2, 2, 2, 2, 1], "ro": [0, 0, 0, 0, 0], "sw": 0, "rat": "The cheapest credible change pays back inside three years: converging onto the core is cheap because the interfaces are reused, and it ends the cost of two platforms. Assumption: the payback view is directional and is confirmed once scope is agreed. That supports changing it now.", "key": false}], "why": "Key point: Same capability in three systems\nWhy: glassRun, Tiramizoo and HypaShip each carry the same business capabilities: customer management, order taking, middle mile and last mile. glassRun adds B2B service rules and B2B scan and routing data that customers value. Running it in parallel duplicates effort and is hard to scale at peak.\nProposal: SingPost would bring the domestic delivery capabilities together as one solution instead of duplicating them. glassRun converges onto the Domestic shipping core and keeps its B2B rules.\nTiming: glassRun is sustained in year 1, then converges onto the core by Q8.", "stack": null, "hosting": null, "answered": 13, "assumptions": []}, {"id": "T004", "name": "Domestic shipping core (Tiramizoo, P2P)", "short": "Domestic shipping core (Tiramizoo, P2P)", "domain": "D2", "type": "Custom build", "decision": "Build", "result": "Build", "second": "Extend", "pts": [-5, 12, 8, 15, -3], "ro": [0, 0, 0, 0, 0], "levers": [{"q": 1, "a": 1, "pts": [1, 2, -2, 3, -1], "ro": [0, 0, 0, 0, 0], "sw": 1, "rat": "Tiramizoo serves healthcare point-to-point delivery with chain-of-custody and time-slot rules. Customers and contracts depend on this capability and competitors do not offer it in the same way, so it is read as a differentiator. Assumption: based on the roadmap and service descriptions; to be confirmed against customer contracts and win and loss reasons. That points towards owning the capability (Build) rather than buying it.", "key": false}, {"q": 2, "a": 3, "pts": [0, 1, -2, 2, 0], "ro": [0, 0, 0, 0, 0], "sw": 1, "rat": "At least one hard constraint (healthcare chain-of-custody rules) fixes how SingPost works here, so a standard product would not fit Tiramizoo as it is. That makes a bought product hard to adopt and favours building or extending.", "key": false}, {"q": 3, "a": 2, "pts": [0, 2, 1, 1, 0], "ro": [0, 0, 0, 0, 0], "sw": -1, "rat": "Some steps (10 to 30%) lean on workarounds because it cannot scale at peak on its own and duplicates scan data. Assumption: the share is judged from the process material and to be validated with the owner.", "key": false}, {"q": 4, "a": 3, "pts": [-2, 1, 2, 2, 0], "ro": [0, 0, 0, 0, 0], "sw": 1, "rat": "Tiramizoo partly fits: between 40% and 75% of the future needs run, and to share the core's scan, routing and proof-of-delivery data while keeping the healthcare rules it needs significant change or new modules. Assumption: future needs are taken from the process sessions and the roadmap. That points towards change rather than keeping it unchanged.", "key": true}, {"q": 5, "a": 1, "pts": [-1, 2, 1, 2, -2], "ro": [0, 0, 0, 0, 0], "sw": 0, "rat": "Strong growth is expected (over 30% or new channels): healthcare delivery is a new segment SingPost wants to grow. Assumption: read from the business forecast and roadmap; no app-level volume forecast was available. Strong growth needs a platform that can extend.", "key": false}, {"q": 6, "a": null, "state": "blank"}, {"q": 7, "a": 3, "pts": [-2, -1, 2, 2, 1], "ro": [0, 0, 0, 0, 0], "sw": 3, "rat": "Custom code: it is still supported, but customisations block upgrades or the roadmap does not cover SingPost needs. Assumption: desk-based reading of the vendor and version position, held as a working assumption.", "key": true}, {"q": 8, "a": null, "state": "blank"}, {"q": 9, "a": 2, "pts": [0, 1, 0, 1, 0], "ro": [0, 0, 0, 0, 0], "sw": 0, "rat": "Changes take two to eight weeks, with partial tests or some regression across neighbouring functions. Assumption: release records not reviewed; to be confirmed.", "key": false}, {"q": 10, "a": 3, "pts": [-3, 0, 1, 2, 1], "ro": [0, 0, 0, 0, 0], "sw": 2, "rat": "Tiramizoo (its hosting is not captured in the catalog) will miss the forecast peak or response targets without redesign. Assumption: no load test was reviewed; to be confirmed.", "key": true}, {"q": 11, "a": 2, "pts": [0, 1, 1, 1, 0], "ro": [0, 0, 0, 0, 0], "sw": 0, "rat": "One ownership test applies to Tiramizoo: the healthcare chain-of-custody records and the delivery network. A product or partner can run it while SingPost keeps control of data and interfaces.", "key": false}, {"q": 12, "a": 1, "pts": [1, 1, 0, 0, -2], "ro": [0, 0, 0, 0, 0], "sw": -1, "rat": "Needed and unique: the core will carry scan data, but the healthcare rules exist only here. That rules out retiring or merging it.", "key": false}, {"q": 13, "a": 1, "pts": [0, 0, 3, -1, 0], "ro": [0, 0, 0, 0, 0], "sw": -1, "rat": "Three or more proven products exist: point-to-point courier tools exist, but none carries healthcare chain-of-custody on SingPost's network. Assumption: product references to be checked against postal operators. That keeps Buy realistic.", "key": false}, {"q": 14, "a": 2, "pts": [0, 1, 1, 0, 0], "ro": [0, 0, 0, 0, 0], "sw": -1, "rat": "Run cost is about average, within 20% of comparable options. Assumption: no run cost per transaction was available for Tiramizoo; to be confirmed.", "key": false}, {"q": 15, "a": null, "state": "blank"}, {"q": 16, "a": 2, "pts": [1, 1, 0, 0, 0], "ro": [0, 0, 0, 0, 0], "sw": -1, "rat": "The three-year economics of the cheapest credible change are marginal: convergence is cheap because the glassRun pattern is reused. Assumption: the economics view is directional and is confirmed once scope is agreed.", "key": false}], "why": "Key point: Same capability in three systems\nWhy: Tiramizoo overlaps with glassRun and HypaShip in the same way. It adds healthcare point-to-point rules (chain of custody and time slots) for a segment SingPost wants to own, but it cannot scale at peak on its own.\nProposal: Tiramizoo converges onto the Domestic shipping core, which keeps its healthcare rules. SingPost would then run one solution instead of duplicating it across systems.\nTiming: Tiramizoo is sustained in year 1, then converges onto the core by Q8.", "stack": null, "hosting": null, "answered": 13, "assumptions": []}, {"id": "T009", "name": "DWS/Neuphonix", "short": "DWS/Neuphonix", "domain": "D2", "type": "Product", "decision": "Extend", "result": "Extend", "second": "Buy", "pts": [4, 14, 11, 4, -6], "ro": [0, 0, 0, 0, 0], "levers": [{"q": 1, "a": 3, "pts": [1, 1, 3, -2, 0], "ro": [0, 0, 0, 0, 0], "sw": -2, "rat": "The DWS adapter measures and an run it while SingPost keeps control of data and interfaces.", "key": false}, {"q": 12, "a": 4, "pts": [0, 0, 0, 0, 5], "ro": [1, 1, 1, 1, 0], "sw": 5, "rat": "No longer needed once its work moves: the Lakehouse covers the data and reports. That leaves retirement as the only workable outcome.", "key": true}, {"q": 13, "a": 2, "pts": [0, 1, 1, 1, 0], "ro": [0, 0, 0, 0, 0], "sw": 0, "rat": "One or two products exist or they cover only part of the scope: no product is needed: the Lakehouse is the target. Assumption: product references to be checked against postal operators.", "key": false}, {"q": 14, "a": 2, "pts": [0, 1, 1, 0, 0], "ro": [0, 0, 0, 0, 0], "sw": 0, "rat": "Run cost is about average, within 20% of comparable options. Assumption: no run cost per transaction was available for The PON billing store; to be confirmed.", "key": false}, {"q": 15, "a": 2, "pts": [0, 0, 0, 0, 0], "ro": [0, 0, 0, 0, 0], "sw": 0, "rat": "The contract renews in 12 to 24 months (Azure data store product). Assumption: contract dates are not in the catalog, so the contract position is held as read.", "key": false}, {"q": 16, "a": 2, "pts": [1, 1, 0, 0, 0], "ro": [0, 0, 0, 0, 0], "sw": -1, "rat": "The three-year economics of the cheapest credible change are marginal: retiring the store avoids duplicate storage and cleansing. Assumption: the economics view is directional and is confirmed once scope is agreed.", "key": false}], "why": "Key point: Billing data held twice\nWhy: PON billing data sits on a separate Azure store apart from the Lakehouse, so the same billing data is held and cleansed twice.\nProposal: Once billing is ingested and the catalogue is live, its two data sets move to the GCP data lakehouse and the reports are rebuilt there. The Azure store is then retired. The work is carried on the Lakehouse line.\nAbsorbed by: Lakehouse line (T077)\nTiming: Q4 to Q5. Switched off in Q5.", "stack": null, "hosting": "Not captured in catalog", "answered": 12, "assumptions": []}, {"id" PA 1.0; SQL Server 2017 on Windows Server 2012 R2. JBoss EAP 5 has been out of vendor support for years; JDK 1.6 is long out of support; Hibernate 3 is long out of support; JPA 1.0 is long out of support. Support has ended or ends within 12 months, so SingPost carries the support risk itself.", "key": false}, {"q": 7, "a": null, "state": "na"}, {"q": 8, "a": 2, "pts": [0, 1, 1, 1, 0], "ro": [0, 0, 0, 0, 0], "sw": 0, "rat": "Occasional incidents (one to three in 12 months) are absorbed by normal operations. Assumption: read from the support notes; the incident log is to be checked.", "key": false}, {"q": 9, "a": 1, "pts": [1, 3, 0, 0, -1], "ro": [0, 0, 0, 0, 0], "sw": 3, "rat": "Changes release in under two weeks with automated tests and independent releases. Assumption: no release records were reviewed; to be confirmed.", "key": true}, {"q": 10, "a": 2, "pts": [0, 2, 0, 1, 0], "ro": [0, 0, 0, 0, 0], "sw": 1, "rat": "CTF (hosted on GCP) has under 30% headroom at forecast peak or needs tuning to add capacity. Assumption: no load test was reviewed; capacity to be confirmed.", "key": false}, {"q": 11, "a": 1, "pts": [1, 2, -3, 3, -2], "ro": [0, 0, 0, 0, 0], "sw": -1, "rat": "Two or three ownership tests apply to CTF: the transaction data and payment logic. SingPost needs to own and control it. That points towards Build or Extend on a SingPost-owned platform.", "key": false}, {"q": 12, "a": 1, "pts": [1, 1, 0, 0, -2], "ro": [0, 0, 0, 0, 0], "sw": 1, "rat": "Needed and unique: no other system runs transactions. That rules out retiring or merging it.", "key": false}, {"q": 13, "a": 2, "pts": [0, 1, 1, 1, 0], "ro": [0, 0, 0, 0, 0], "sw": 0, "rat": "One or two products exist or they cover only part of the scope: payment engines exist, but replacing a working engine is risky and costly. Assumption: product references to be checked against postal operators.", "key": false}, {"q": 14, "a": null, "state": "blank"}, {"q": 15, "a": 4, "pts": [1, 1, 0, 1, 0], "ro": [0, 0, 0, 0, 0], nd is confirmed once scope is agreed. That supports changing it now.", "key": true}], "why": "Key point: A job for AI\nWhy: PCA Recon reconciles payments and postage transactions, but it sits on a legacy stack (JDK 8, SQL Server 2017). Its job is a natural fit for AI.\nProposal: Its reconciliation rules move into a reconciliation agent in the AI use cases. The agent matches CTF transactions to settlement files, applies tolerances and flags exceptions. PCA Recon is retired rather than re-platformed, and its history stays archived in its SQL Server store.\nAbsorbed by: AI use cases line (T067)\nTiming: Retired after the CTF cut-over (Q8). Switched off in Q10.", "stack": "JDK 1.8.0_25; SQL Server 2017", "hosting": "GCP", "answered": 15, "assumptions": ["The reconciliation agent scope is assumed to be agreed with the payments team"]}, {"id": "T034", "name": "IPS-Mail/EMS", "short": "IPS-Mail/EMS", "domain": "D4", "type": "Product", "decision": "Extend", "result": "Extend", "second": "Buy", "pts": [-2, 11, 9, 9, 2], "ro": [0, 0, 0, 0, 0], "levers": [{"q": 1, "a": 3, "pts": [1, 1, 3, -2, 0], "ro": [0, 0, 0, 0, 0], "sw": -2, "rat": "IPS-Mail/EMS handles UPU mail and EMS products. Any postal or parcel operator runs this kind of capability, so it is standard practice and not an edge. That points towards buying or extending a standard product rather than building.", "key": false}, {"q": 2, "a": 3, "pts": [0, 1, -2, 2, 0], "ro": [0, 0, 0, 0, 0], "sw": 3, "rat": "At least one hard constraint (UPU rules and appointed products) fixes how SingPost works here, so a standard product would not fit IPS-Mail/EMS as it is. That makes a bought product hard to adopt and favours building or extending.", "key": true}, {"q": 3, "a": 2, "pts": [0, 2, 1, 1, 0], "ro": [0, 0, 0, 0, 0], "sw": 1, "rat": "Some steps (10 to 30%) lean on workarounds because two instances run the same UPU products. Assumption: the share is judged from the process material and to be validated with the owner.", "key": f ffers it"], "why": "An edge favours owning the capability (Build); standard practice favours a product (Buy)."}, "2": {"theme": "Need", "name": "Adopting a standard way of working", "question": "If a standard product fitted this app's function, could SingPost adopt its standard way of working? Count the regulatory, network and contract constraints that fix how SingPost works today.", "answers": ["Yes: no hard constraint found", "With changes: one or two constraints that can be negotiated or changed", "No: at least one hard constraint (regulation, network or contract clause) fixes how SingPost works"], "why": "If SingPost can adopt a standard way of working, a product becomes realistic."}, "3": {"theme": "Need", "name": "Workarounds", "question": "Of the steps this app is meant to support, what share need a workaround? Count the steps with spreadsheets, manual keying or off-system handling in the L3 walk-through.", "answers": ["Rarely: under 10% of steps", "For some steps: 10% to 30% of steps", "Routinely: more than 30% of steps"], "why": "Heavy workarounds point to gaps that extension or replacement should close."}, "4": {"theme": "Need", "name": "Fit with future process needs", "question": "What share of the future-need items recorded in the process sessions can the application meet?", "answers": ["Fully: every future-need item runs with configuration only", "Mostly: at least 75% of items run; the gaps need moderate change", "Partly: 40% to under 75% of items run; significant change or new modules needed", "Poorly: under 40% of items can run"], "why": "If the app cannot run the target process, keeping it unchanged is not an option."}, "5": {"theme": "Need", "name": "Growth and scale", "question": "What is the business forecast growth over the next 3 years in the users, transactions or items this app serves?", "answers": ["Strong (more than 30% growth, or new channels or products)", "Moderate (10 to 30%)", "Flat (under 10%)", "Declining"], "why": "Strong growth needs an app that can extend; flat or falling volumes favour keeping or retiring."}, "6": {"theme": "Architecture and condition", "name": "Support (custom build)", "question": "Custom build only: is the code supportable (platform support and end of life, documentation, skills)?", "answers": ["Platform supported for more than 3 years and the code is documented", "Platform support ends in 1 to 3 years, or documentation is thin", "Platform support ends within 12 months, or has already ended"], "why": "Platform support ending takes Retain off the table; healthy support keeps it open."}, "7": {"theme": "Architecture and condition", "name": "Roadmap and upgrade (product)", "question": "Product-based only: is the vendor roadmap aligned with SingPost needs and is the upgrade path realistic (version currency, upgrade effort, customisations, support end)?", "answers": ["Current version, roadmap aligned with SingPost needs, upgrades routine, support for more than 3 years", "Supported but behind on version, roadmap partly aligned, or the next upgrade needs a project", "Still supported, but customisations block upgrades or the roadmap does not cover SingPost needs", "Vendor support ends within 12 months, or the product is discontinued"], "why": "Vendor end of life or customisation lock-in rules out simply keeping the product."}, "8": {"theme": "Architecture and condition", "name": "Stability", "question": "How often does it fail or slow down in operation, particularly at peak? (Use incident records for the last 12 months.)", "answers": ["Rarely: no severity 1 or 2 incident in the last 12 months", "Occasionally: 1 to 3 incidents in 12 months, absorbed by normal operations", "Often: more than 3 incidents in 12 months, or any failure at peak"], "why": "Frequent failures weaken the case for keeping the app as it is."}, "9": {"theme": "Architecture and condition", "name": "Changeability and coupling", "question": "How fast and safely can the application be changed? Use the last 12 months of release records: request-to-release time, automated tests, and whether one change forces a release or regression test of unrelated functions.", "answers": ["Easy: under 2 weeks with automated tests, and changes are released on their own", "Moderate: 2 to 8 weeks, or only partial tests, or some regression across neighbouring functions", "Hard: over 8 weeks, no automated tests, or every change forces a release or regression test of unrelated functions"], "why": "Slow, untested or tightly coupled change makes extending costly and points to rebuilding; fast, tested, independent change favours extending."}, "10": {"theme": "Architecture and condition", "name": "Scalability and peak performance", "question": "How much headroom does it have at forecast peak volume, and can it add capacity without redesign? Use monitoring data or a load test.", "answers": ["Yes: scales out, with at least 30% headroom at forecast peak", "Yes, but with under 30% headroom, or only with tuning or a re-platform", "No: forecast peak or response-time targets will be missed"], "why": "An app that scales out can grow with volumes; one that cannot needs redesign or replacement."}, "11": {"theme": "Architecture and condition", "name": "Ownership need", "question": "How many of the three ownership tests apply? (1) Customer experience: the app directly shapes what customers see. (2) Data: the app is the system of record for data SingPost uses outside the app and a vendor could restrict its export or use. (3) Network: it is tied to SingPost's own network operations (hubs, delivery bases, lockers) and could not run as a generic service.", "answers": ["Core: two or three tests apply, so SingPost needs to own and control it", "Important: one test applies; a product or partner can run it while SingPost keeps control of data and interfaces", "Not strategic: no test applies; a standard product or service is enough"], "why": "Where the app shapes the customer experience, holds data SingPost must control, or function viewMethod(){var h='<h2>Method: how 16 lever answers become one decision</h2><p class="lede">The same table of points was applied to every app. Click a lever to see its question, all answer options and the points each option gives to the five outcomes.</p>';
  h+='<div class="grid g2"><div class="card"><h3 class="t">Four steps</h3><ol class="as"><li><b>Answer the levers.</b> 16 levers in four themes: Need (Q1 to Q5), Architecture and condition (Q6 to Q11), Alternatives (Q12, Q13) and Economics (Q14 to Q16). Q6 applies to custom builds and Q7 to products. A lever without an answer is not scored and adds no points.</li><li><b>Add points.</b> Each answer adds points to Retain, Extend, Buy, Build and Retire (+3 strongly supports, +1 or +2 supports, 0 neutral, \u22121 to \u22123 argues against).</li><li><b>Apply rule-outs.</b> Some answers make an outcome unworkable: support ending within 12 months or a discontinued product rules out Retain; no mature alternative rules out Buy; a function the business no longer needs leaves only Retire. A ruled-out outcome cannot win.</li><li><b>Pick the top outcome.</b> The highest total wins; ties break in the order Retain, Extend, Buy, Build, Retire (least change first).</li></ol></div>'
   +'<div class="card"><h3 class="t">What the five outcomes mean</h3><ul class="as"><li>'+chipD('Retain')+' keep as is, with conditions.</li><li>'+chipD('Extend')+' keep the app or use another SingPost platform and invest in the gaps.</li><li>'+chipD('Buy')+' a product or SaaS takes over.</li><li>'+chipD('Build')+' SingPost builds, in-house or with a vendor.</li><li>'+chipD('Retire')+' switch off after the functions move.</li></ul><p class="small">An app is in the plan when it meets at least one principle: architecture or ownership changes, it unlocks a roadmap capability, or it carries legacy that a routine upgrade cannot fix. Meeting none means it is retained as BAU.</p></div></div>';
  h+='<div class="card"><h3 class="t">The 16 levers (click for options and points)</h3><div class="grid g4">';
  for(var q=1;q<=16;q++){var L=lev(q);h+='<button class="card" style="text-align:left;margin:0;padding:10px 12px" data-lever="'+q+'"><span class="co-theme">'+esc(L.theme)+'</span><b>Q'+q+' \u00b7 '+esc(L.name)+'</b><div class="small muted" style="margin-top:3px">'+L.answers.length+' answer options</div></button>';}
  return h+'</div></div>';}
function viewAssumptions(){var h='<h2>Assumptions that apply to the scoring and the decisions</h2><p class="lede">Programme-wide assumptions first; each app page and each answer pop-up lists the assumptions specific to that app.</p>';
  h+='<div class="grid g2"><div class="card"><h3 class="t">Scoring basis</h3><ul class="as"><li>This is a <b>desk-based study</b>: answers come from the system catalog, the architecture material, the process sessions and the roadmap, with incident and release information where available.</li><li>Answers are held as <b>working assumptions</b> and validated with the app owners in the outcome sessions; each pop-up says which part of the answer is an assumption.</li><li>A lever without an answer is <b>not scored</b>: it is treated as neutral (0 points) and the decision rests on the other levers. An answer supplied later is added and the result re-read.</li><li>For the new apps, levers are answered for the target solution; levers that describe a current system are not scored.</li></ul></div>'
   +'<div class="card"><h3 class="t">Who is scored and who is not</h3><ul class="as"><li>135 systems and apps: 51 are scored on the 16 levers and 84 are not, each for a stated reason (43 BAU by default, 4 with a pre-existing project to replace or sunset, 20 already decommissioned, 17 not an application, including HR hosting Thailand, Call Centre and the Excel to BigQuery conversion).</li><li>SGLocate and Imaging Server are BAU by default and not scored.</li><li>Customer Portal, Dynamics CRM, PON billing data and PCA Recon are scored (Retire): their functions move to the consolidated portal, the new CRM, the GCP data lakehouse and the AI use cases.</li></ul></div></div>';
  var op=apps.filter(function(a){return a.assumptions&&a.assumptions.length;});
  h+='<div class="card"><h3 class="t">Assumptions by app</h3><div class="tw"><table><thead><tr><th>App</th><th>Assumption</th></tr></thead><tbody>';
  op.forEach(function(a){h+='<tr class="link" data-go="app='+a.id+'"><td><b>'+esc(a.short)+'</b></td><td class="small">'+a.assumptions.map(esc).join('<br>')+'</td></tr>';});
  return h+'</tbody></table></div></div>';}
var co=document.getElementById('callout'), scrim=document.getElementById('scrim'), lastFocus=null, anchorEl=null;
function closeCallout(){co.classList.remove('on');scrim.classList.remove('on');co.innerHTML='';if(anchorEl&&anchorEl.classList)anchorEl.classList.remove('sel');if(lastFocus&&document.body.contains(lastFocus)){try{lastFocus.focus({preventScroll:true});}catch(e){}}lastFocus=null;anchorEl=null;}
function openCallout(html,anchor){if(anchorEl&&anchorEl.classList)anchorEl.classList.remove('sel');lastFocus=anchor;anchorEl=anchor;if(anchor&&anchor.tagName==='TR')anchor.classList.add('sel');
  co.innerHTML='<span class="arrow" id="coArrow"></span>'+html;co.classList.add('on');if(window.innerWidth<=700)scrim.classList.add('on');position(anchor);var x=co.querySelector('.co-x');if(x)x.focus({preventScroll:true});}
function position(anchor){if(window.innerWidth<=700||!anchor)return;var ar=anchor.getBoundingClientRect(),sx=window.pageXOffset,sy=window.pageYOffset,vw=document.documentElement.clientWidth;
  var w=Math.min(560,vw-24),left=ar.left+sx+Math.min(40,ar.width/3);left=Math.max(12,Math.min(left,vw+sx-w-12));var top=ar.bottom+sy+12;
  co.style.left=left+'px';co.style.top=top+'px';co.style.width=w+'px';var arrow=document.getElementById('coArrow');if(arrow){arrow.style.left=Math.max(18,Math.min(w-30,ar.left+sx+Math.min(70,ar.width/2)-left))+'px';}
  var cr=co.getBoundingClientRect();if(cr.bottom>window.innerHeight-10){window.scrollBy({top:Math.min(cr.bottom-window.innerHeight+24,ar.top-90),behavior:'auto'});}}
function optList(q,sel,res){var L=lev(q),h='<ul class="opts">';L.answers.forEach(function(t,i){var p=ptsOf(q,i+1);h+='<li class="'+(sel===i+1?'sel':'')+'"><span class="n">'+(i+1)+'</span><span>'+esc(t)+(sel===i+1?' <b>\u2190 given</b>':'')+'</span>'+ptChips(p.pts,p.ro,res)+'</li>';});
  return h+'</ul><div style="display:flex;justify-content:flex-end;margin-top:4px">'+ptHead()+'</div>';}
function leverCallout(a,q){var L=lev(q),l=a?a.levers[q-1]:null,h='';
  h+='<div class="co-head"><div style="flex:1"><span class="co-theme">'+esc(L.theme)+(a?' \u00b7 '+esc(a.short):'')+'</span><h3 id="coTitle">Q'+q+' \u00b7 '+esc(L.name)+'</h3></div><button class="co-x" aria-label="Close">\u00d7</button></div><div class="co-body">';
  h+='<div class="sec">Question</div><p>'+esc(L.question)+'</p>';
  if(!a){h+='<div class="sec">Answer options and the points each gives</div>'+optList(q,null,null)+'<div class="sec">Why the matrix asks it</div><p>'+esc(L.why)+'</p>';if(q===6)h+='<p class="small muted">Applies to custom builds only.</p>';if(q===7)h+='<p class="small muted">Applies to products only.</p>';return h+'</div>';}
  if(l.a==null){var txt; if(l.state==='na')txt='<b>Not applicable</b> for this app type: '+(q===6?'Q6 applies to custom builds only.':'Q7 applies to products only.')+' It adds no points.';
    else if(a.type==='New app')txt='<b>Not scored.</b> This lever describes a current system and '+esc(a.short)+' is a new app, so it adds no points.';
    else txt='<b>Assumption in place: not scored.</b> The matrix treats this lever as neutral (0 points) and the decision for '+esc(a.short)+' rests on the other levers. If the app owner supplies the answer in the outcome session, it is added and the result re-read.';
    h+='<div class="sec">Answer for '+esc(a.short)+'</div><div class="verdict z">'+txt+'</div><div class="sec">Options if it were answered</div>'+optList(q,null,a.result)+'<div class="sec">Why the matrix asks it</div><p>'+esc(L.why)+'</p>';return h+'</div>';}
  var win=a.result,sec=a.second,p=ptsOf(q,l.a),pr=p.pts[OUT.indexOf(win)],ps=p.pts[OUT.indexOf(sec)],cls=l.sw>0?'p':(l.sw<0?'n':'z'),v;
  if(l.sw>0)v='This answer <b>supports '+win+'</b>: it gives '+win+' '+sg(pr)+' and '+sec+' '+sg(ps)+', a net '+sg(l.sw)+' for '+win+'.';
  else if(l.sw<0)v='This answer <b>leans towards '+sec+'</b>: it gives '+win+' '+sg(pr)+' and '+sec+' '+sg(ps)+'. '+win+' still wins on the other levers.';
  else v='This answer is <b>neutral between '+win+' and '+sec+'</b>: it gives both '+sg(pr)+'.';
  h+='<div class="sec">Answer given</div>'+optList(q,l.a,win);
  h+='<div class="sec">Why this answer for '+esc(a.short)+'</div><div class="rat">'+esc(l.rat||'')+'</div>';
  h+='<div class="sec">What this answer does to the decision</div><div class="verdict '+cls+'">'+v+'</div>';
  var roN=OUT.filter(function(o,i){return p.ro[i]>0;}); if(roN.length)h+='<p style="margin-top:6px"><b>Rule-out.</b> This answer rules out '+roN.join(', ')+'; it cannot win however many points it scores.</p>';
  h+='<div class="sec">Why the matrix asks it</div><p>'+esc(L.why)+'</p>';
  h+='<p class="small"><button class="appbtn" data-go="app='+a.id+'">Open '+esc(a.short)+'</button></p>';return h+'</div>';}
document.addEventListener('click',function(e){var r=e.target.closest('tr.row[data-lev]');if(r&&state.kind==='app'){openCallout(leverCallout(byId[state.id],+r.getAttribute('data-lev')),r);return;}
  var c=e.target.closest('[data-cell]');if(c&&!c.disabled){var p=c.getAttribute('data-cell').split('|');openCallout(leverCallout(byId[p[0]],+p[1]),c);return;}
  var lv=e.target.closest('[data-lever]');if(lv){openCallout(leverCallout(null,+lv.getAttribute('data-lever')),lv);return;}
  if(e.target.closest('.co-x')||e.target===scrim){closeCallout();return;} if(co.classList.contains('on')&&!e.target.closest('#callout')&&!e.target.closest('[data-go]')){closeCallout();}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&co.classList.contains('on')){closeCallout();return;} if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('tr.row[data-lev]')){e.preventDefault();e.target.click();}});
window.addEventListener('resize',function(){if(co.classList.contains('on'))position(anchorEl);});
onHash();
})();
</script></body></html>
